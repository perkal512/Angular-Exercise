<div *ngIf="!loading; else loadingTpl" class="garages-container">
  <h1>ניהול מוסכים</h1>

  <div class="header-controls">
    <app-garage-multiselect></app-garage-multiselect>
    <app-garage-add-button (addClick)="addSelectedGarages()"></app-garage-add-button>
  </div>

  <h3>מוסכים השמורים במערכת</h3>
  <app-garage-table></app-garage-table>
</div>

<ng-template #loadingTpl>
  <div class="loading-overlay">
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
