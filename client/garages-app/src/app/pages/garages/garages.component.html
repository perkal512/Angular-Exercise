<div class="garages-container" *ngIf="!loading; else loadingTpl">
  <h1>ניהול מוסכים</h1>
  <div class="header-controls">
    <app-garage-multiselect></app-garage-multiselect>
    <button mat-raised-button color="primary" (click)="addSelectedGarages()">הוספת מוסכים</button>
  </div>

  <app-garage-table></app-garage-table>
</div>

<ng-template #loadingTpl>
  <div class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
