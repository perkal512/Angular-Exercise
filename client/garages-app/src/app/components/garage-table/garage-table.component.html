<div class="table-wrapper">
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>סנן לפי קוד מוסך, שם, כתובת או תחום</mat-label>
    <input matInput (keyup)="dataSource.filter = $any($event.target).value.trim().toLowerCase()">
  </mat-form-field>
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="misparMosah">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>קוד מוסך</th>
      <td mat-cell *matCellDef="let g">{{ g.misparMosah }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>שם מוסך</th>
      <td mat-cell *matCellDef="let g">{{ g.name }}</td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>כתובת</th>
      <td mat-cell *matCellDef="let g">{{ g.address }}</td>
    </ng-container>

    <ng-container matColumnDef="profession">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>תחום עיקרי</th>
      <td mat-cell *matCellDef="let g">{{ g.profession }}</td>
    </ng-container>

    <ng-container matColumnDef="manager">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>מנהל מוסך</th>
      <td mat-cell *matCellDef="let g">{{ g.manager }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let r; columns: displayedColumns;" @fadeInOut></tr>
  </table>
  

</div>
